
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#103d2c">
<title>İddaa Analiz Botu 26/27</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#172033;font-family:Arial,sans-serif}
header{background:#103d2c;color:white;text-align:center;padding:20px 10px;font-size:22px;font-weight:bold}
header small{display:block;font-size:12px;font-weight:normal;margin-top:7px}
main{max-width:900px;margin:auto;padding:12px}
.panel,.match{background:white;border-radius:15px;padding:14px;margin-bottom:13px}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:10px}
button,input,select{font:inherit;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:white;color:#172033;min-width:0}
button{cursor:pointer}
.controls button{flex:1}
#dateLabel{flex:2;text-align:center;font-weight:bold}
#search,#league{width:100%;margin-bottom:10px}
.status{font-size:13px;color:#475569;line-height:1.6;overflow-wrap:anywhere}
.leagueName{font-size:13px;color:#64748b;margin-bottom:10px}
.teams{text-align:center;font-weight:bold;font-size:19px;line-height:1.6;overflow-wrap:anywhere}
.time{text-align:center;color:#64748b;font-size:13px;margin:8px 0 12px}
.odds{background:#f1f5f9;border-radius:10px;padding:12px;margin-top:10px}
.oddsTitle{font-size:13px;font-weight:bold;margin-bottom:8px}
.oddsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.oddsGrid label{text-align:center;font-size:12px;color:#475569}
.oddsGrid input{width:100%;margin-top:5px;text-align:center;font-weight:bold}
.analyseBtn{width:100%;background:#176638;color:white;border:0;font-weight:bold;font-size:16px;margin-top:11px}
.analysis{margin-top:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;font-size:14px;line-height:1.9;overflow-wrap:anywhere}
.analysis h3{margin:0 0 8px;font-size:17px}
.tag{display:inline-block;background:#dcfce7;color:#166534;padding:2px 7px;border-radius:6px;margin:2px}
.err{color:#b91c1c}
.small{font-size:12px;color:#64748b;margin-top:9px;line-height:1.6}
@media(max-width:360px){header{font-size:19px}.match{padding:10px}.oddsGrid{gap:5px}.oddsGrid input{padding:10px 3px}}
</style>
</head>
<body>
<header>
⚽ İddaa Analiz Botu 26/27
<small>Maçkolik maçları • Manuel 1-X-2 oranları • Skor tahmini</small>
</header>
<main>
<section class="panel">
 <div class="controls">
  <button onclick="changeDay(-1)">‹ Önceki</button>
  <div id="dateLabel"></div>
  <button onclick="changeDay(1)">Sonraki ›</button>
 </div>
 <input id="search" placeholder="🔎 Takım ara..." oninput="renderMatches()">
 <select id="league" onchange="renderMatches()">
  <option value="">🏆 Tüm Ligler</option>
 </select>
 <div class="controls">
  <button onclick="loadData()">🔄 Yenile</button>
  <button onclick="goToday()">📅 Bugün</button>
 </div>
 <div id="status" class="status">⏳ Maçlar yükleniyor...</div>
</section>
<div id="matches"></div>
</main>
<script>
"use strict";
let selectedDate=new Date();
let allMatches=[];
let manualOdds={};
let requestNo=0;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const dateKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const months=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

function showDate(){
 $("dateLabel").textContent=selectedDate.getDate()+" "+months[selectedDate.getMonth()]+" "+selectedDate.getFullYear();
}
function changeDay(n){selectedDate.setDate(selectedDate.getDate()+n);loadData()}
function goToday(){selectedDate=new Date();loadData()}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function first(obj,keys){
 for(const k of keys){
  if(obj&&obj[k]!==undefined&&obj[k]!==null&&obj[k]!==""){
   const v=obj[k];
   if(typeof v==="string"||typeof v==="number")return String(v);
   if(typeof v==="object"){
    const z=first(v,["name","teamName","displayName","shortName","title","label","value"]);
    if(z)return z;
   }
  }
 }
 return "";
}
function teamName(m,home){
 const keys=home
 ?["homeTeam","home_team","home","homeName","team1","localteam","homeCompetitor","evSahibi"]
 :["awayTeam","away_team","away","awayName","team2","visitorteam","awayCompetitor","deplasman"];
 const n=first(m,keys);
 if(n)return n;
 const full=first(m,["matchName","match_name","name","title"]);
 if(full){
  const parts=full.split(/\s+(?:vs?\.?|[-–])\s+/i);
  if(parts.length>=2)return parts[home?0:1].trim();
 }
 return home?"Ev Sahibi":"Deplasman";
}
function leagueName(m){
 return first(m,["leagueName","league_name","competitionName","competition_name","league","competition","tournament","championship"])||"Diğer Ligler";
}
function matchTime(m){
 const t=first(m,["time","matchTime","match_time","kickoff","dateTime","datetime","startTime","start_time","date"]);
 if(!t)return "Saat belirtilmedi";
 if(/^\d{4}-\d{2}-\d{2}T/.test(t)){
  const d=new Date(t);
  if(!isNaN(d))return pad(d.getHours())+":"+pad(d.getMinutes());
 }
 const z=t.match(/\b\d{1,2}:\d{2}\b/);
 return z?z[0]:t;
}
async function fetchJson(url){
 const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw Error("Veri dosyası bulunamadı: "+url);
 return r.json();
}
async function loadData(){
 showDate();
 const req=++requestNo,key=dateKey(selectedDate);
 $("status").textContent="⏳ "+key+" tarihli maçlar yükleniyor...";
 $("matches").innerHTML="";
 allMatches=[];
 manualOdds={};
 try{
  const data=await fetchJson("data/oranlar-"+key+".json");
  if(req!==requestNo)return;
  allMatches=Array.isArray(data)?data:
   Array.isArray(data.matches)?data.matches:
   Array.isArray(data.fixtures)?data.fixtures:
   Array.isArray(data.data)?data.data:[];
  fillLeagues();
  renderMatches();
  $("status").textContent=allMatches.length?
   "✅ "+allMatches.length+" maç bulundu • "+key:
   "⚠️ Dosya bulundu ama maç listesi boş.";
 }catch(e){
  if(req!==requestNo)return;
  $("status").innerHTML='<span class="err">❌ '+esc(e.message)+'</span>';
  $("matches").innerHTML='<section class="panel">data/oranlar-'+esc(key)+'.json dosyasını ve GitHub Actions çalışmasını kontrol et.</section>';
 }
}
function fillLeagues(){
 const sel=$("league"),old=sel.value;
 const names=[...new Set(allMatches.map(leagueName))].sort((a,b)=>a.localeCompare(b,"tr"));
 sel.innerHTML='<option value="">🏆 Tüm Ligler</option>'+
  names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");
 if(names.includes(old))sel.value=old;
}
function renderMatches(){
 const q=$("search").value.trim().toLocaleLowerCase("tr"),lg=$("league").value;
 const list=allMatches.map((m,i)=>({m,i})).filter(({m})=>{
  const teams=(teamName(m,true)+" "+teamName(m,false)).toLocaleLowerCase("tr");
  return (!q||teams.includes(q))&&(!lg||leagueName(m)===lg);
 });
 if(!list.length){
  $("matches").innerHTML='<section class="panel">Bu seçimde maç bulunamadı.</section>';
  return;
 }
 $("matches").innerHTML=list.map(({m,i})=>card(m,i)).join("");
}
function card(m,i){
 const v=manualOdds[i]||{one:"",x:"",two:""};
 return '<article class="match">'+
 '<div class="leagueName">🏆 '+esc(leagueName(m))+'</div>'+
 '<div class="teams">'+esc(teamName(m,true))+'<br><span style="color:#64748b">VS</span><br>'+esc(teamName(m,false))+'</div>'+
 '<div class="time">🕒 '+esc(matchTime(m))+'</div>'+
 '<div class="odds"><div class="oddsTitle">✍️ Maçkolik oranlarını gir</div>'+
 '<div class="oddsGrid">'+
 '<label>1 - Ev sahibi<input inputmode="decimal" placeholder="1.85" value="'+esc(v.one)+'" oninput="setOdds('+i+',\'one\',this.value)"></label>'+
 '<label>X - Beraberlik<input inputmode="decimal" placeholder="3.40" value="'+esc(v.x)+'" oninput="setOdds('+i+',\'x\',this.value)"></label>'+
 '<label>2 - Deplasman<input inputmode="decimal" placeholder="4.10" value="'+esc(v.two)+'" oninput="setOdds('+i+',\'two\',this.value)"></label>'+
 '</div></div>'+
 '<button class="analyseBtn" onclick="analyseMatch('+i+')">📊 Analiz Et</button>'+
 '<div id="analysis-'+i+'"></div></article>';
}
function setOdds(i,k,v){
 if(!manualOdds[i])manualOdds[i]={one:"",x:"",two:""};
 manualOdds[i][k]=v;
}
function parseOdd(v){
 const s=String(v??"").trim().replace(",",".");
 return s?Number(s):NaN;
}
function implied(odds){
 const sum=odds.reduce((s,o)=>s+1/o.odd,0);
 return odds.map(o=>({name:o.name,p:(1/o.odd)/sum,odd:o.odd}));
}
function poisson(k,l){
 let p=Math.exp(-l);
 for(let j=1;j<=k;j++)p*=l/j;
 return p;
}
function pct(p){return (100*p).toFixed(1)+"%"}
function scoreModel(odds){
 const p=implied(odds),target={};
 p.forEach(o=>target[o.name]=o.p);
 let best={err:Infinity,lh:1.35,la:1.05};
 for(let lh=.35;lh<=3.5;lh+=.05){
  for(let la=.35;la<=3.5;la+=.05){
   let h=0,d=0,a=0;
   for(let x=0;x<=9;x++)for(let y=0;y<=9;y++){
    const z=poisson(x,lh)*poisson(y,la);
    if(x>y)h+=z;else if(x===y)d+=z;else a+=z;
   }
   const err=(h-target["1"])**2+(d-target["X"])**2+(a-target["2"])**2+
    .012*(lh+la-2.45)**2;
   if(err<best.err)best={err,lh,la};
  }
 }
 return best;
}
function scorePredictions(model){
 const out=[];
 for(let h=0;h<=7;h++)for(let a=0;a<=7;a++)
  out.push({h,a,p:poisson(h,model.lh)*poisson(a,model.la)});
 return out.sort((a,b)=>b.p-a.p);
}
function resultProbs(model){
 let h=0,d=0,a=0;
 for(let x=0;x<=10;x++)for(let y=0;y<=10;y++){
  const p=poisson(x,model.lh)*poisson(y,model.la);
  if(x>y)h+=p;else if(x===y)d+=p;else a+=p;
 }
 return [{name:"1",p:h},{name:"X",p:d},{name:"2",p:a}].sort((a,b)=>b.p-a.p);
}
function halfScores(model){
 const out=[];
 for(let h=0;h<=4;h++)for(let a=0;a<=4;a++)
  out.push({h,a,p:poisson(h,model.lh*.45)*poisson(a,model.la*.45)});
 return out.sort((a,b)=>b.p-a.p);
}
function iymsResults(model){
 const out={};
 for(let h=0;h<=4;h++)for(let a=0;a<=4;a++){
  const p1=poisson(h,model.lh*.45)*poisson(a,model.la*.45);
  const ht=h>a?"1":h===a?"X":"2";
  for(let fh=0;fh<=4;fh++)for(let fa=0;fa<=4;fa++){
   const p2=poisson(fh,model.lh*.55)*poisson(fa,model.la*.55);
   const ft=h+fh>a+fa?"1":h+fh===a+fa?"X":"2";
   const key=ht+"/"+ft;
   out[key]=(out[key]||0)+p1*p2;
  }
 }
 const sum=Object.values(out).reduce((a,b)=>a+b,0)||1;
 return Object.entries(out).map(([name,p])=>({name,p:p/sum})).sort((a,b)=>b.p-a.p);
}
function analyseMatch(i){
 const v=manualOdds[i]||{one:"",x:"",two:""};
 const odds=[
  {name:"1",odd:parseOdd(v.one)},
  {name:"X",odd:parseOdd(v.x)},
  {name:"2",odd:parseOdd(v.two)}
 ];
 if(odds.some(o=>!Number.isFinite(o.odd)||o.odd<=1||o.odd>1000)){
  $("analysis-"+i).innerHTML='<div class="analysis err">⚠️ Analiz için üç kutuya da geçerli oran gir. Örnek: 1.85</div>';
  return;
 }
 const model=scoreModel(odds),scores=scorePredictions(model);
 const best=scores[0],alt=scores[1],res=resultProbs(model);
 const half=halfScores(model)[0],iyms=iymsResults(model).slice(0,3);
 const total=model.lh+model.la;
 const p25=1-poisson(0,total)-poisson(1,total)-poisson(2,total);
 const p35=1-poisson(0,total)-poisson(1,total)-poisson(2,total)-poisson(3,total);
 const pBT=(1-Math.exp(-model.lh))*(1-Math.exp(-model.la));
 const home=teamName(allMatches[i],true),away=teamName(allMatches[i],false);
 const corner=8.5;
 $("analysis-"+i).innerHTML=
 '<div class="analysis"><h3>📊 Maç Analizi</h3>'+
 '<div><b>⚽ Skor tahmini:</b> '+best.h+' - '+best.a+' <span class="tag">'+pct(best.p)+'</span></div>'+
 '<div><b>Alternatif skor:</b> '+alt.h+' - '+alt.a+' ('+pct(alt.p)+')</div>'+
 '<div><b>Maç sonucu:</b> '+res[0].name+' ('+pct(res[0].p)+')</div>'+
 '<div><b>1-X-2 olasılıkları:</b> '+res.map(x=>x.name+' '+pct(x.p)).join(' • ')+'</div>'+
 '<div><b>İlk yarı skoru:</b> '+half.h+' - '+half.a+'</div>'+
 '<div><b>İlk yarı sonucu:</b> '+(half.h>half.a?'1':half.h===half.a?'X':'2')+'</div>'+
 '<div><b>İY/MS tahmini:</b> '+iyms.map(x=>'<span class="tag">'+x.name+' '+pct(x.p)+'</span>').join(' ')+'</div>'+
 '<div><b>2.5 gol:</b> '+(p25>=.5?'ÜST':'ALT')+' • Üst '+pct(p25)+' / Alt '+pct(1-p25)+'</div>'+
 '<div><b>3.5 gol:</b> '+(p35>=.5?'ÜST':'ALT')+' • Üst '+pct(p35)+' / Alt '+pct(1-p35)+'</div>'+
 '<div><b>KG:</b> '+(pBT>=.5?'VAR':'YOK')+' • Var '+pct(pBT)+' / Yok '+pct(1-pBT)+'</div>'+
 '<div><b>Tahmini toplam gol:</b> '+total.toFixed(2)+'</div>'+
 '<div><b>🚩 Tahmini toplam korner:</b> '+corner.toFixed(1)+' (çok düşük güven; takım korner verisi kullanılmıyor)</div>'+
 '<div class="small">Tahminler, girdiğin 1-X-2 oranlarından olasılıkları hesaplayıp Poisson gol modeliyle skor tahmini üretir. Sadece 1-X-2 oranları toplam gol ve korner olasılıklarını tek başına belirleyemez. Kesin sonuç değildir.</div>'+
 '</div>';
}
showDate();
loadData();
</script>
</body>
</html>
