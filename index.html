
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İddaa Analiz Botu 26/27</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#172033;font-family:Arial,sans-serif}
header{background:#102e24;color:white;padding:17px 12px;text-align:center;font-size:21px;font-weight:bold}
main{max-width:850px;margin:auto;padding:12px}
.panel{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px}
button,select,input{font-size:15px;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:#fff;color:#172033}
button{cursor:pointer}
.controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.controls button{flex:1}
#dateLabel{font-weight:bold;text-align:center;flex:2}
#search{width:100%;margin:9px 0}
#league{width:100%}
.status{font-size:13px;color:#475569;margin-top:9px}
.match{background:#fff;border-radius:12px;padding:13px;margin-bottom:12px}
.leagueName{font-size:12px;color:#64748b;margin-bottom:9px}
.teams{text-align:center;font-size:17px;font-weight:bold;line-height:1.5}
.time{text-align:center;color:#64748b;font-size:13px;margin:5px}
.odds{font-size:13px;background:#f1f5f9;border-radius:8px;padding:9px;margin-top:8px;overflow-wrap:anywhere}
.analysis{background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:10px;margin-top:9px;line-height:1.65;font-size:14px}
.analysis h3{font-size:15px;margin:5px 0}
.analyseBtn{width:100%;margin-top:10px;background:#166534;color:#fff;border:0;font-weight:bold}
.tag{display:inline-block;background:#dcfce7;color:#166534;border-radius:6px;padding:3px 7px;margin:2px;font-size:12px}
.error{color:#b91c1c}
.small{font-size:12px;color:#64748b}
</style>
</head>
<body>
<header>⚽ İddaa Analiz Botu 26/27</header>
<main>
<section class="panel">
<div class="controls">
<button onclick="changeDay(-1)">‹ Önceki</button>
<div id="dateLabel"></div>
<button onclick="changeDay(1)">Sonraki ›</button>
</div>
<input id="search" placeholder="🔎 Takım ara..." oninput="renderMatches()">
<select id="league" onchange="renderMatches()"><option value="">🏆 Tüm Ligler</option></select>
<div class="controls" style="margin-top:9px">
<button onclick="loadData()">🔄 Yenile</button>
<button onclick="goToday()">📅 Bugün</button>
</div>
<div id="status" class="status">⏳ Veriler yükleniyor...</div>
</section>
<div id="matches"></div>
</main>
<script>
"use strict";

let selectedDate=new Date();
let allMatches=[];
let allOdds={};
let competitions={};

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const dateKey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const months=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

function showDate(){
 $("dateLabel").textContent=selectedDate.getDate()+" "+months[selectedDate.getMonth()]+" "+selectedDate.getFullYear();
}
function changeDay(n){
 selectedDate.setDate(selectedDate.getDate()+n);
 showDate();
 loadData();
}
function goToday(){
 selectedDate=new Date();
 showDate();
 loadData();
}
function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function first(obj,keys,def=""){
 for(const k of keys)if(obj&&obj[k]!==undefined&&obj[k]!==null&&obj[k]!=="")return obj[k];
 return def;
}
function teamName(m,home){
 return String(first(m,home?
 ["homeTeam","home_team","home","homeName","team1","localteam","evSahibi","ev_sahibi","ev"]:
 ["awayTeam","away_team","away","awayName","team2","visitorteam","deplasman","deplasman_takim"],home?"Ev Sahibi":"Deplasman"));
}
function leagueName(m){
 let v=first(m,["leagueName","league_name","competitionName","competition_name","league","competition","tournament"],"Diğer Ligler");
 if(typeof v==="object")v=first(v,["name","title"],"Diğer Ligler");
 return String(v);
}
function matchTime(m){
 return String(first(m,["time","matchTime","match_time","kickoff","dateTime","datetime","startTime"],"Saat belirtilmedi"));
}
function matchId(m,i){
 return String(first(m,["id","matchId","eventId","fixtureId","match_id"],teamName(m,true)+"-"+teamName(m,false)+"-"+i));
}
async function fetchJson(url){
 const r=await fetch(url+"?t="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw Error("Dosya bulunamadı: "+url);
 return r.json();
}
async function loadData(){
 showDate();
 $("status").textContent="⏳ Veriler yükleniyor...";
 $("matches").innerHTML="";
 allMatches=[];
 allOdds={};
 const key=dateKey(selectedDate);
 try{
  const data=await fetchJson("data/oranlar-"+key+".json");
  allMatches=Array.isArray(data)?data:
   Array.isArray(data.matches)?data.matches:
   Array.isArray(data.fixtures)?data.fixtures:
   Array.isArray(data.data)?data.data:[];
  allOdds=data.odds||data.oranlar||data.markets||{};
  competitions=data.competitions||{};
  normalizeOdds();
  fillLeagues();
  renderMatches();
  $("status").textContent="✅ "+allMatches.length+" maç bulundu • "+key;
  if(!allMatches.length)$("status").textContent="⚠️ Dosya açıldı ancak maç listesi boş.";
 }catch(e){
  $("status").innerHTML='<span class="error">❌ '+esc(e.message)+'<br>GitHub deposunda data/'+key+'.json dosyasını kontrol et.</span>';
  $("matches").innerHTML='<section class="panel">Bu tarihte veri dosyası bulunamadı. Başka bir gün seçebilir veya dosyanın GitHub deposunda bulunduğunu kontrol edebilirsin.</section>';
 }
}
function normalizeOdds(){
 if(Array.isArray(allOdds)){
  const map={};
  allOdds.forEach((o,i)=>{
   const id=first(o,["matchId","match_id","eventId","fixtureId","id"],"");
   if(id)map[id]=o;
   else map[i]=o;
  });
  allOdds=map;
 }
}
function fillLeagues(){
 const sel=$("league"),old=sel.value;
 const names=[...new Set(allMatches.map(leagueName))].sort((a,b)=>a.localeCompare(b,"tr"));
 sel.innerHTML='<option value="">🏆 Tüm Ligler</option>'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join("");
 if(names.includes(old))sel.value=old;
}
function renderMatches(){
 const q=$("search").value.trim().toLocaleLowerCase("tr");
 const league=$("league").value;
 const list=allMatches.map((m,i)=>({m,i})).filter(({m})=>{
  const names=(teamName(m,true)+" "+teamName(m,false)).toLocaleLowerCase("tr");
  return (!q||names.includes(q))&&(!league||leagueName(m)===league);
 });
 if(!list.length){
  $("matches").innerHTML='<section class="panel">Bu seçimde maç bulunamadı.</section>';
  return;
 }
 $("matches").innerHTML=list.map(({m,i})=>matchCard(m,i)).join("");
}
function oddsFor(m,i){
 const id=matchId(m,i);
 return allOdds[id]||allOdds[String(m.id??"")]||allOdds[i]||m.odds||m.markets||{};
}
function matchCard(m,i){
 const h=teamName(m,true),a=teamName(m,false),id=esc(matchId(m,i));
 const o=oddsFor(m,i);
 return '<article class="match" data-id="'+id+'">'+
 '<div class="leagueName">🏆 '+esc(leagueName(m))+'</div>'+
 '<div class="teams">'+esc(h)+'<br><span style="color:#64748b">VS</span><br>'+esc(a)+'</div>'+
 '<div class="time">🕒 '+esc(matchTime(m))+'</div>'+
 '<div class="odds">'+oddsSummary(o)+'</div>'+
 '<button class="analyseBtn" onclick="analyseMatch('+i+')">📊 Analiz Et</button>'+
 '<div id="analysis-'+i+'"></div></article>';
}
function oddsSummary(o){
 const ms=findMarket(o,["Maç Sonucu","Mac Sonucu","Maç Sonucu 1X2","MS","1X2","Match Result","Full Time Result"]);
 const ou=findMarket(o,["2.5 Üst/Alt","Toplam Gol 2.5","Over Under 2.5","Over/Under 2.5","2.5 Goals"]);
 const btts=findMarket(o,["Karşılıklı Gol","KG Var Yok","Both Teams To Score","BTTS"]);
 const pieces=[];
 if(ms.length)pieces.push("MS: "+ms.map(x=>x.name+" "+x.odd).join(" • "));
 if(ou.length)pieces.push("2.5: "+ou.map(x=>x.name+" "+x.odd).join(" • "));
 if(btts.length)pieces.push("KG: "+btts.map(x=>x.name+" "+x.odd).join(" • "));
 return pieces.length?esc(pieces.join(" | ")):"Oran verisi yok; tahmin maç bilgilerinden hesaplanır.";
}
function cleanName(s){
 return String(s??"").toLocaleLowerCase("tr").replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]/g,"");
}
function toList(v){
 if(!v)return [];
 if(Array.isArray(v))return v.map(x=>({
  name:String(first(x,["name","label","outcome","selection","value","type","key"],"")),
  odd:Number(first(x,["odd","odds","price","coefficient","decimal","valueOdd"],NaN))
 })).filter(x=>x.name&&Number.isFinite(x.odd)&&x.odd>1);
 if(typeof v==="object"){
  if(v.outcomes||v.selections||v.options||v.values)return toList(v.outcomes||v.selections||v.options||v.values);
  return Object.entries(v).map(([name,val])=>({
   name,odd:Number(typeof val==="object"?first(val,["odd","odds","price","value"],NaN):val)
  })).filter(x=>Number.isFinite(x.odd)&&x.odd>1);
 }
 return [];
}
function findMarket(o,aliases){
 if(!o)return [];
 const entries=[];
 function walk(obj,depth){
  if(!obj||typeof obj!=="object"||depth>3)return;
  if(Array.isArray(obj)){
   obj.forEach(x=>{if(x&&typeof x==="object")walk(x,depth+1)});
   return;
  }
  for(const [k,v] of Object.entries(obj)){
   const label=String(first(v,["marketName","market_name","name","label","title"],k));
   const key=cleanName(k+" "+label);
   const hit=aliases.some(a=>key.includes(cleanName(a)));
   if(hit){
    const list=toList(v);
    if(list.length)entries.push(...list);
   }
   if(v&&typeof v==="object"&&!Array.isArray(v))walk(v,depth+1);
  }
 }
 walk(o,0);
 const seen=new Set();
 return entries.filter(x=>{
  const k=cleanName(x.name);
  if(seen.has(k))return false;
  seen.add(k);return true;
 });
}
function implied(list){
 const valid=list.filter(x=>x.odd>1);
 const total=valid.reduce((s,x)=>s+1/x.odd,0);
 return total?valid.map(x=>({name:x.name,p:(1/x.odd)/total})): [];
}
function findP(list,aliases){
 const hit=list.find(x=>aliases.some(a=>cleanName(x.name)===cleanName(a))||
  aliases.some(a=>cleanName(x.name).includes(cleanName(a))));
 return hit?hit.p:null;
}
function poisson(k,l){
 let p=Math.exp(-l);
 for(let i=1;i<=k;i++)p*=l/i;
 return p;
}
function scoreModel(ms,ou){
 const probs=implied(ms);
 let p1=findP(probs,["1","Ev Sahibi","Home"]),px=findP(probs,["X","Beraberlik","Draw"]),p2=findP(probs,["2","Deplasman","Away"]);
 if(p1===null||px===null||p2===null){p1=.43;px=.28;p2=.29}
 const sum=p1+px+p2||1;p1/=sum;px/=sum;p2/=sum;
 const op=implied(ou);
 let over=findP(op,["Üst","Over","2.5 Üst"]);
 if(over===null)over=.52;
 let best={err:Infinity,lh:1.35,la:1.05};
 for(let lh=.25;lh<=3.5;lh+=.05){
  for(let la=.25;la<=3.5;la+=.05){
   let h=0,d=0,a=0,ov=0;
   for(let x=0;x<=8;x++)for(let y=0;y<=8;y++){
    const pr=poisson(x,lh)*poisson(y,la);
    if(x>y)h+=pr;else if(x===y)d+=pr;else a+=pr;
    if(x+y>=3)ov+=pr;
   }
   const err=(h-p1)**2+(d-px)**2+(a-p2)**2+(ov-over)**2;
   if(err<best.err)best={err,lh,la};
  }
 }
 return best;
}
function scorePredictions(model){
 const out=[];
 for(let h=0;h<=5;h++)for(let a=0;a<=5;a++)
  out.push({h,a,p:poisson(h,model.lh)*poisson(a,model.la)});
 return out.sort((x,y)=>y.p-x.p);
}
function marketIyMs(o){
 const raw=findMarket(o,["İlk Yarı/Maç Sonucu","İY/MS","HT/FT","Half Time Full Time","Half Time/Full Time"]);
 return implied(raw).map(x=>({name:canonicalIyMs(x.name),p:x.p})).filter(x=>x.name);
}
function canonicalIyMs(s){
 const z=cleanName(s);
 const m=z.match(/([1x2])(?:\/|-|_)?([1x2])/);
 if(m)return m[1].toUpperCase()+"/"+m[2].toUpperCase();
 const aliases={"11":"1/1","xx":"X/X","22":"2/2","1x":"1/X","12":"1/2","x1":"X/1","x2":"X/2","2x":"2/X","21":"2/1"};
 return aliases[z]||"";
}
function calcIyMs(model){
 const out=[];
 for(let h=0;h<=5;h++)for(let a=0;a<=5;a++){
  const p=poisson(h,model.lh*.45)*poisson(a,model.la*.45);
  const hp=h>a?"1":h===a?"X":"2";
  for(let fh=0;fh<=5;fh++)for(let fa=0;fa<=5;fa++){
   const fp=poisson(fh,model.lh*.55)*poisson(fa,model.la*.55);
   const ftH=h+fh,ftA=a+fa;
   const ft=ftH>ftA?"1":ftH===ftA?"X":"2";
   out.push({name:hp+"/"+ft,p:p*fp});
  }
 }
 const grouped={};
 out.forEach(x=>grouped[x.name]=(grouped[x.name]||0)+x.p);
 const total=Object.values(grouped).reduce((s,x)=>s+x,0)||1;
 return Object.entries(grouped).map(([name,p])=>({name,p:p/total}));
}
function percent(p){return (p*100).toFixed(1)+"%"}
function marketPick(o,aliases){
 const l=implied(findMarket(o,aliases));
 return l.sort((a,b)=>b.p-a.p)[0]||null;
}
function analyseMatch(i){
 const m=allMatches[i],o=oddsFor(m,i);
 const h=teamName(m,true),a=teamName(m,false);
 const ms=findMarket(o,["Maç Sonucu","Mac Sonucu","Maç Sonucu 1X2","MS","1X2","Match Result","Full Time Result"]);
 const ou25=findMarket(o,["Toplam Gol 2.5","Over Under 2.5","Over/Under 2.5","2.5 Goals","2.5 Üst/Alt"]);
 const ou35=findMarket(o,["Toplam Gol 3.5","Over Under 3.5","Over/Under 3.5","3.5 Goals","3.5 Üst/Alt"]);
 const btts=findMarket(o,["Karşılıklı Gol","KG Var Yok","Both Teams To Score","BTTS"]);
 const ht=findMarket(o,["İlk Yarı Sonucu","First Half Result","Half Time Result","İY"]);
 const corners=findMarket(o,["Toplam Korner","Total Corners","Corners"]);
 const model=scoreModel(ms,ou25);
 const scores=scorePredictions(model);
 const best=scores[0],second=scores[1];
 const pOver25=1-([0,1,2].reduce((s,n)=>s+poisson(n,model.lh+model.la),0));
 const pOver35=1-([0,1,2,3].reduce((s,n)=>s+poisson(n,model.lh+model.la),0));
 const pBtts=(1-Math.exp(-model.lh))*(1-Math.exp(-model.la));
 const resultProbs=implied(ms);
 let result=resultProbs.sort((x,y)=>y.p-x.p)[0];
 if(!result)result={name:model.lh>model.la+.35?"1":model.la>model.lh+.35?"2":"X",p:Math.max(.34,1-Math.abs(model.lh-model.la)*.12)};
 const firstHalf=implied(ht).sort((x,y)=>y.p-x.p)[0];
 const iyms=marketIyMs(o);
 const iymsFinal=iyms.length?iyms:calcIyMs(model);
 iymsFinal.sort((x,y)=>y.p-x.p);
 const halfGoals=model.lh*.45+model.la*.45;
 const totalGoals=model.lh+model.la;
 const cornerPick=marketPick(o,["Toplam Korner","Total Corners","Corners"]);
 const cornerText=cornerPick?
  cornerPick.name+" ("+percent(cornerPick.p)+")":
  "Korner oranı yok; kesin sayı verisi olmadan yaklaşık 8–11 toplam korner beklentisi";
 const out=$("analysis-"+i);
 out.innerHTML='<div class="analysis">'+
 '<h3>📊 Maç Analizi</h3>'+
 '<div><b>Skor tahmini:</b> '+best.h+' - '+best.a+' <span class="tag">'+percent(best.p)+'</span></div>'+
 '<div><b>Alternatif skor:</b> '+second.h+' - '+second.a+'</div>'+
 '<div><b>Maç sonucu:</b> '+esc(result.name)+' <span class="tag">'+percent(result.p)+'</span></div>'+
 '<div><b>İlk yarı sonucu:</b> '+(firstHalf?esc(firstHalf.name)+" ("+percent(firstHalf.p)+")":halfGoals<.9?"X ağırlıklı":"1 / X olasılıkları yakın")+'</div>'+
 '<div><b>İlk yarı tahmini skor:</b> '+(model.lh*.45>=model.la*.45?"1-0 / 0-0":"0-0 / 0-1")+'</div>'+
 '<div><b>İY/MS tahmini:</b> '+iymsFinal.slice(0,3).map(x=>'<span class="tag">'+esc(x.name)+' '+percent(x.p)+'</span>').join(" ")+'</div>'+
 '<div><b>2.5 gol:</b> '+(pOver25>=.5?"ÜST":"ALT")+' • Üst '+percent(pOver25)+' / Alt '+percent(1-pOver25)+'</div>'+
 '<div><b>3.5 gol:</b> '+(pOver35>=.5?"ÜST":"ALT")+' • Üst '+percent(pOver35)+' / Alt '+percent(1-pOver35)+'</div>'+
 '<div><b>KG Var/Yok:</b> '+(pBtts>=.5?"KG VAR":"KG YOK")+' • Var '+percent(pBtts)+' / Yok '+percent(1-pBtts)+'</div>'+
 '<div><b>Tahmini toplam gol:</b> '+totalGoals.toFixed(2)+'</div>'+
 '<div><b>Korner analizi:</b> '+esc(cornerText)+'</div>'+
 '<div class="small">Tahminler istatistiksel modeldir; kesin sonuç veya garanti değildir.</div>'+
 '</div>';
}
showDate();
loadData();
</script>
</body>
</html>
