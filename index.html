 
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>İddaa Analiz Botu 26/27</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f6;color:#17202a}
header{background:#111827;color:white;padding:18px 12px;text-align:center}
header h1{margin:0;font-size:22px}
header p{color:#cbd5e1;font-size:13px}
.panel,.match{background:white;margin:10px;padding:12px;border-radius:12px;box-shadow:0 2px 8px #0001}
button,input,select{width:100%;padding:12px;margin:4px 0;border:1px solid #d1d5db;border-radius:8px;background:white;font-size:15px}
.row{display:flex;gap:6px}
.row button{width:50%}
#status{text-align:center;margin:10px;padding:12px;background:white;border-radius:10px;font-weight:bold;font-size:13px}
.league{color:#2563eb;font-size:13px;font-weight:bold;margin-bottom:8px}
.teams{font-size:17px;font-weight:bold;line-height:1.5}
.info{color:#64748b;font-size:12px;margin-top:8px}
.analysis-button{margin-top:12px;background:#111827;color:white;font-weight:bold}
.analysis{margin-top:10px;padding:12px;background:#f8fafc;border-radius:8px;font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.market{margin-top:9px;padding:10px;background:white;border:1px solid #e5e7eb;border-radius:8px}
.market-title{font-weight:bold;font-size:14px;margin-bottom:6px}
.odds{display:flex;gap:6px;flex-wrap:wrap}
.odd{background:#eef2ff;padding:8px;border-radius:7px;font-weight:bold}
.prob{color:#475569;font-size:12px}
.summary{margin-top:10px;padding:10px;background:#ecfdf5;border-radius:8px;font-weight:bold}
.warning{margin-top:8px;padding:9px;background:#fff7ed;border-radius:7px;font-size:12px;color:#9a3412}
.empty{text-align:center;padding:25px;color:#64748b}
.tag{display:inline-block;background:#dbeafe;padding:5px 8px;border-radius:6px;margin:2px;font-weight:bold}
.small{font-size:11px;color:#64748b;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>⚽ İddaa Analiz Botu 26/27</h1>
<p>Maçkolik • İddaa oranları • İstatistiksel tahmin</p>
</header>

<div class="panel">
<div class="row">
<button onclick="changeDay(-1)">⬅ Önceki</button>
<button onclick="changeDay(1)">Sonraki ➡</button>
</div>
<input id="search" placeholder="🔎 Takım ara..." oninput="render()">
<select id="league" onchange="render()">
<option value="">Tüm Ligler</option>
</select>
<button onclick="loadData()">🔄 Maçları Yenile</button>
</div>

<div id="status">⏳ Veriler yükleniyor...</div>
<div id="matches"></div>

<script>
"use strict";

let selectedDate=new Date();
let allMatches=[];
let allOdds={};
window.visibleMatches=[];

const pad=n=>String(n).padStart(2,"0");

function dateString(d){
 return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function changeDay(n){
 selectedDate.setDate(selectedDate.getDate()+n);
 loadData();
}
function setStatus(t){
 document.getElementById("status").textContent=t;
}
function escapeHtml(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 })[c]);
}
function teamName(t){
 if(typeof t==="string")return t;
 return t?.name||t?.teamName||t?.displayName||t?.shortName||"";
}
function home(m){
 return teamName(m.homeTeam||m.home||m.homeParticipant)||
        m.homeTeamName||m.homeName||"Ev Sahibi";
}
function away(m){
 return teamName(m.awayTeam||m.away||m.awayParticipant)||
        m.awayTeamName||m.awayName||"Deplasman";
}
function league(m){
 return m.league||m.competitionName||m.leagueName||
        m.competition?.name||m.tournamentName||"Diğer";
}
function time(m){
 const raw=m.mstUtc||m.matchDate||m.startTime||m.dateUtc;
 if(raw){
  const d=new Date(raw);
  if(!isNaN(d.getTime()))return pad(d.getHours())+":"+pad(d.getMinutes());
 }
 return m.matchTime||m.time||"--:--";
}
function matchId(m){
 return m.id??m.matchId??m.eventId??m.fixtureId??m.match_id??null;
}
function norm(s){
 return String(s??"")
  .toLocaleLowerCase("tr-TR")
  .replace(/ı/g,"i")
  .normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]/g,"");
}
function oddsFor(m){
 const id=matchId(m);
 if(id==null)return null;
 if(Object.prototype.hasOwnProperty.call(allOdds,String(id))){
  return allOdds[String(id)];
 }
 const target=String(id).trim();
 const key=Object.keys(allOdds).find(k=>String(k).trim()===target);
 return key?allOdds[key]:null;
}

/* Market içindeki seçenekleri farklı JSON biçimlerinden okur. */
function cleanOptions(list){
 if(!list)return [];

 let items=[];
 if(Array.isArray(list)){
  items=list;
 }else if(typeof list==="object"){
  if(Array.isArray(list.options))items=list.options;
  else if(Array.isArray(list.outcomes))items=list.outcomes;
  else if(Array.isArray(list.selections))items=list.selections;
  else if(Array.isArray(list.values))items=list.values;
  else{
   items=Object.entries(list).map(([name,value])=>{
    if(value&&typeof value==="object"){
     return {name, ...value};
    }
    return {name,oran:value};
   });
  }
 }else{
  return [];
 }

 return items.map(x=>{
  if(typeof x==="number"||typeof x==="string"){
   return {name:"",odd:parseFloat(String(x).replace(",","."))};
  }
  const name=x?.secenek??x?.option??x?.name??x?.label??
             x?.outcomeName??x?.selectionName??x?.title??x?.key;
  const raw=x?.oran??x?.odds??x?.odd??x?.value??
            x?.price??x?.decimalOdds??x?.rate;
  const odd=parseFloat(String(raw??"").replace(",","."));
  return {name:String(name??"").trim(),odd};
 }).filter(x=>x.name&&Number.isFinite(x.odd)&&x.odd>1&&x.odd<1000);
}

function getMarketEntries(o){
 if(!o||typeof o!=="object")return [];
 if(Array.isArray(o)){
  return o.map(x=>[
   String(x?.title??x?.name??x?.marketName??""),
   x?.options??x?.outcomes??x?.selections??x?.values??x
  ]);
 }
 return Object.entries(o).map(([k,v])=>{
  if(v&&typeof v==="object"&&!Array.isArray(v)){
   const title=v.title??v.marketName??v.name;
   const options=v.options??v.outcomes??v.selections??v.values;
   if(title&&options)return [String(title),options];
  }
  return [k,v];
 });
}

function findMarket(o,names){
 const entries=getMarketEntries(o);
 if(!entries.length)return null;
 const wanted=names.map(norm);

 // Önce başlıkların tam eşleşmesini dene.
 for(const [key,value] of entries){
  if(wanted.includes(norm(key))&&cleanOptions(value).length)return value;
 }

 // Ardından benzer başlıkları dene.
 for(const [key,value] of entries){
  const k=norm(key);
  if(cleanOptions(value).length&&
     wanted.some(n=>n.length>=3&&(k.includes(n)||n.includes(k)))){
   return value;
  }
 }
 return null;
}

function marketProb(list){
 const a=cleanOptions(list);
 const total=a.reduce((s,x)=>s+1/x.odd,0);
 if(!total)return [];
 return a.map(x=>({...x,p:100*(1/x.odd)/total}));
}
function findOption(list,patterns){
 const a=marketProb(list);
 return a.find(x=>patterns.some(p=>p.test(norm(x.name))));
}
function poisson(lambda,k){
 let p=Math.exp(-lambda);
 for(let i=1;i<=k;i++)p*=lambda/i;
 return p;
}

function findResultOption(list,which){
 const options=marketProb(list);
 const patterns={
  home:[/^1$/, /^ms1$/, /evsahibi/, /homewin/, /home$/],
  draw:[/^x$/, /^0$/, /^msx$/, /beraber/, /draw/],
  away:[/^2$/, /^ms2$/, /deplasman/, /awaywin/, /away$/]
 };
 return options.find(x=>patterns[which].some(p=>p.test(norm(x.name))));
}

function scoreModel(ms,ou){
 if(!ms)return null;
 const p1=findResultOption(ms,"home");
 const px=findResultOption(ms,"draw");
 const p2=findResultOption(ms,"away");
 if(!p1||!px||!p2)return null;

 const target=[p1.p/100,px.p/100,p2.p/100];
 const over=findOption(ou||[],[/^ust25$/,/over25/,/ust/]);
 const under=findOption(ou||[],[/^alt25$/,/under25/,/alt/]);
 let targetOver=null;

 if(over&&under)targetOver=over.p/(over.p+under.p);
 else if(over)targetOver=over.p/100;

 let best=null,bestErr=Infinity;
 for(let h=.15;h<=3.51;h+=.05){
  for(let a=.15;a<=3.51;a+=.05){
   let ph=0,pxp=0,pa=0,po=0;
   for(let i=0;i<=9;i++){
    for(let j=0;j<=9;j++){
     const pr=poisson(h,i)*poisson(a,j);
     if(i>j)ph+=pr;
     else if(i===j)pxp+=pr;
     else pa+=pr;
     if(i+j>=3)po+=pr;
    }
   }
   let err=(ph-target[0])**2+(pxp-target[1])**2+(pa-target[2])**2;
   if(targetOver!==null)err+=1.5*(po-targetOver)**2;
   if(err<bestErr){
    bestErr=err;
    best={h,a,ph,px:pxp,pa,over:po};
   }
  }
 }
 return best;
}

function scorePredictions(model){
 if(!model)return [];
 const scores=[];
 for(let h=0;h<=6;h++){
  for(let a=0;a<=6;a++){
   scores.push({h,a,p:poisson(model.h,h)*poisson(model.a,a)});
  }
 }
 return scores.sort((x,y)=>y.p-x.p).slice(0,5);
}

function halftimePredictions(model){
 if(!model)return [];
 const h=model.h*.45,a=model.a*.45;
 const results=[];
 for(let i=0;i<=5;i++){
  for(let j=0;j<=5;j++){
   const first=poisson(h,i)*poisson(a,j);
   for(let x=0;x<=7;x++){
    for(let y=0;y<=7;y++){
     const second=poisson(Math.max(.01,model.h-h),x)*
                  poisson(Math.max(.01,model.a-a),y);
     const finalH=i+x,finalA=j+y;
     const half=i>j?"1":i===j?"X":"2";
     const full=finalH>finalA?"1":finalH===finalA?"X":"2";
     results.push({key:half+"/"+full,p:first*second});
    }
   }
  }
 }
 const sum={};
 results.forEach(r=>sum[r.key]=(sum[r.key]||0)+r.p);
 return Object.entries(sum).map(([key,p])=>({key,p}))
  .sort((a,b)=>b.p-a.p).slice(0,3);
}

function findMarkets(o){
 return {
  ms:findMarket(o,[
   "Maç Sonucu","Mac Sonucu","Maç Sonucu 1X2","MS","1X2",
   "Match Result","Full Time Result","Maç Sonucu (90 Dakika)"
  ]),
  ou:findMarket(o,[
   "2,5 Alt/Üst","2.5 Alt/Üst","2.5 Alt Üst","2,5 Alt Üst",
   "Toplam Gol 2.5","Toplam Gol 2,5","Alt/Üst 2.5",
   "Over/Under 2.5","Goals Over/Under"
  ]),
  ou35:findMarket(o,[
   "3,5 Alt/Üst","3.5 Alt/Üst","3.5 Alt Üst",
   "Toplam Gol 3.5","Toplam Gol 3,5","Over/Under 3.5"
  ]),
  iy:findMarket(o,[
   "İlk Yarı Sonucu","Ilk Yari Sonucu","İY","IY",
   "Half Time Result","Devre Sonucu","İlk Yarı 1X2"
  ]),
  iyms:findMarket(o,[
   "İlk Yarı/Maç Sonucu","İY/MS","IY/MS",
   "Half Time/Full Time","İlk Yarı Maç Sonucu"
  ]),
  kg:findMarket(o,[
   "Karşılıklı Gol","KG Var/Yok","Karşılıklı Gol Var/Yok",
   "KG","Both Teams To Score","Karşılıklı Gol Olur Mu"
  ]),
  corners:findMarket(o,[
   "Toplam Korner","Korner Alt/Üst","Korner Sayısı","Corners",
   "Total Corners","Total Corners Over/Under","Toplam Korner Alt Üst"
  ])
 };
}

function marketHtml(title,list){
 const p=marketProb(list);
 if(!p.length)return "";
 return "<div class='market'><div class='market-title'>"+escapeHtml(title)+
 "</div><div class='odds'>"+
 p.map(x=>"<div class='odd'>"+escapeHtml(x.name)+" — "+x.odd.toFixed(2)+
 "<div class='prob'>Piyasa olasılığı: "+x.p.toFixed(1)+"%</div></div>").join("")+
 "</div></div>";
}

function debugMarkets(o){
 const entries=getMarketEntries(o);
 if(!entries.length)return "Bu maçın odds kaydı boş veya beklenen biçimde değil.";
 const names=entries.map(([k,v])=>{
  const opts=cleanOptions(v);
  return escapeHtml(k)+" ("+opts.length+" seçenek)";
 });
 return "Dosyada bulunan market başlıkları:<br>"+names.join("<br>");
}

function makeAnalysis(match){
 const o=oddsFor(match);
 if(!o){
  return "<div class='warning'>Bu maçın oran kaydı eşleşmedi. Maç ID: "+
   escapeHtml(matchId(match)??"yok")+
   ". JSON içindeki odds anahtarlarıyla maç ID'si farklı olabilir.</div>";
 }

 const m=findMarkets(o);
 let html="<b>📊 MAÇ ANALİZİ</b>";
 html+=marketHtml("🏆 Maç Sonucu Oranları",m.ms);
 html+=marketHtml("⚽ 2.5 Alt / Üst",m.ou);
 html+=marketHtml("⚽ 3.5 Alt / Üst",m.ou35);
 html+=marketHtml("🥅 Karşılıklı Gol",m.kg);
 html+=marketHtml("⏱️ İlk Yarı Sonucu Oranları",m.iy);
 html+=marketHtml("🎯 İY/MS Oranları",m.iyms);

 const model=scoreModel(m.ms,m.ou);

 if(model){
  const sp=scorePredictions(model);
  const top=sp[0];
  html+="<div class='summary'>🎯 EN OLASI SKOR: "+top.h+" - "+top.a+
   "<br>Ev sahibi gol beklentisi: "+model.h.toFixed(2)+
   "<br>Deplasman gol beklentisi: "+model.a.toFixed(2)+
   "<br>Modelin 2.5 üst olasılığı: "+(model.over*100).toFixed(1)+"%</div>";

  html+="<div class='market'><div class='market-title'>📌 En olası skorlar</div>"+
   sp.map(s=>"<span class='tag'>"+s.h+"-"+s.a+" · "+(s.p*100).toFixed(1)+"%</span>").join("")+
   "</div>";

  if(m.iyms){
   html+=marketHtml("🎯 İY/MS - Piyasa oranları",m.iyms);
  }else{
   const iy=halftimePredictions(model);
   html+="<div class='market'><div class='market-title'>⏱️ Tahmini İY/MS</div>"+
    iy.map(x=>"<span class='tag'>"+x.key+" · "+(x.p*100).toFixed(1)+"%</span>").join("")+
    "<div class='prob'>İlk yarı gol ortalaması yaklaşık model varsayımıdır; doğrudan Maçkolik İY/MS oranı değildir.</div></div>";
  }
 }else{
  html+="<div class='warning'>Skor modeli için tanınan 1-X-2 maç sonucu oranları bulunamadı. Aşağıdaki market başlıklarını kontrol edelim.</div>";
 }

 if(m.iy){
  const p=marketProb(m.iy);
  const first=p.find(x=>/^1$/.test(norm(x.name)));
  const draw=p.find(x=>/^x$/.test(norm(x.name)));
  const second=p.find(x=>/^2$/.test(norm(x.name)));
  if(first&&draw&&second){
   const sorted=[first,draw,second].sort((a,b)=>b.p-a.p);
   html+="<div class='summary'>⏱️ İlk yarıda öne çıkan sonuç: "+
    escapeHtml(sorted[0].name)+" · "+sorted[0].p.toFixed(1)+"%</div>";
  }
 }

 if(m.corners){
  html+=marketHtml("🚩 Korner oranları",m.corners);
  const cp=marketProb(m.corners);
  const over=cp.find(x=>/ust|over/i.test(norm(x.name)));
  if(over){
   html+="<div class='summary'>🚩 Korner üst seçeneği: "+
    escapeHtml(over.name)+" · Piyasa olasılığı "+over.p.toFixed(1)+"%</div>";
  }
 }else{
  html+="<div class='warning'>🚩 Bu maç için tanınan korner marketi bulunamadı. Korner oranı veya takım korner istatistiği yoksa güvenilir toplam korner tahmini hesaplanamaz.</div>";
 }

 html+="<div class='warning'>Tahminler kesin sonuç değildir. Skor modeli yalnızca bulunan oranlardan yaklaşık hesaplanır; kadro, sakatlık ve güncel takım performansı ayrıca değerlendirilmemiştir.</div>";
 html+="<details class='market'><summary><b>🔎 Veri kontrolü</b></summary><div class='small'>Maç ID: "+
  escapeHtml(matchId(match)??"yok")+"<br>"+debugMarkets(o)+"</div></details>";
 return html;
}

function toggleAnalysis(i){
 const box=document.getElementById("analysis-"+i);
 const btn=document.getElementById("analysis-btn-"+i);
 if(!box||!btn)return;

 if(box.style.display==="none"){
  box.innerHTML=makeAnalysis(window.visibleMatches[i]);
  box.style.display="block";
  btn.textContent="📊 Analizi Gizle";
 }else{
  box.style.display="none";
  btn.textContent="📊 Analiz Et";
 }
}

function prepareLeagues(){
 const s=document.getElementById("league"),old=s.value;
 s.innerHTML='<option value="">Tüm Ligler</option>';
 [...new Set(allMatches.map(league))].sort().forEach(l=>{
  const op=document.createElement("option");
  op.value=l;op.textContent=l;s.appendChild(op);
 });
 if([...s.options].some(x=>x.value===old))s.value=old;
}

function render(){
 const q=document.getElementById("search").value.toLocaleLowerCase("tr-TR").trim();
 const l=document.getElementById("league").value;
 const matches=allMatches.filter(m=>
  (!q||home(m).toLocaleLowerCase("tr-TR").includes(q)||
       away(m).toLocaleLowerCase("tr-TR").includes(q))&&
  (!l||league(m)===l)
 );

 window.visibleMatches=matches;
 const c=document.getElementById("matches");
 if(!matches.length){
  c.innerHTML="<div class='empty'>Bu kriterlere uygun maç bulunamadı.</div>";
  return;
 }

 c.innerHTML=matches.map((m,i)=>"<div class='match'>"+
  "<div class='league'>"+escapeHtml(league(m))+"</div>"+
  "<div class='teams'>"+escapeHtml(home(m))+" 🆚 "+escapeHtml(away(m))+"</div>"+
  "<div class='info'>🕐 "+escapeHtml(time(m))+"</div>"+
  "<button class='analysis-button' id='analysis-btn-"+i+"' onclick='toggleAnalysis("+i+")'>📊 Analiz Et</button>"+
  "<div class='analysis' id='analysis-"+i+"' style='display:none'></div></div>"
 ).join("");
}

async function loadData(){
 const d=dateString(selectedDate);
 setStatus("⏳ "+d+" maçları yükleniyor...");
 try{
  const r=await fetch("data/oranlar-"+d+".json?x="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw Error("Veri dosyası bulunamadı: "+r.status);
  const data=await r.json();

  allMatches=Array.isArray(data.matches)?data.matches:[];
  allOdds=data.odds&&typeof data.odds==="object"?data.odds:{};

  prepareLeagues();
  render();

  setStatus("✅ "+d+" • "+allMatches.length+" maç • Oran kaydı: "+
   Object.keys(allOdds).length+" maç");
 }catch(e){
  allMatches=[];
  allOdds={};
  document.getElementById("matches").innerHTML=
   "<div class='empty'>⚠️ Bu tarih için veri yüklenemedi.<br>"+
   escapeHtml(e.message||e)+"</div>";
  setStatus("❌ Veri yüklenemedi. Tarihi ve JSON dosyasını kontrol et.");
  console.error(e);
 }
}

loadData();
</script>
</body>
</html>
