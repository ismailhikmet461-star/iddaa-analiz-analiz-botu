    <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>İddaa Analiz Botu 26/27</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f3f6;
    color:#17202a;
}

header{
    background:#111827;
    color:#fff;
    padding:18px 12px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:22px;
}

header p{
    margin:6px 0 0;
    color:#cbd5e1;
    font-size:13px;
}

.panel{
    background:#fff;
    margin:10px;
    padding:10px;
    border-radius:12px;
    box-shadow:0 2px 8px #0001;
}

button,
select,
input{
    width:100%;
    padding:12px;
    margin:4px 0;
    border:1px solid #d1d5db;
    border-radius:8px;
    background:#fff;
    font-size:15px;
}

button{
    cursor:pointer;
}

.row{
    display:flex;
    gap:6px;
}

.row button{
    width:50%;
}

#status{
    margin:10px;
    padding:12px;
    text-align:center;
    font-weight:bold;
    background:#fff;
    border-radius:10px;
}

.match{
    background:#fff;
    margin:10px;
    padding:14px;
    border-radius:12px;
    box-shadow:0 2px 8px #0001;
}

.league{
    color:#2563eb;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.teams{
    font-size:17px;
    font-weight:bold;
    line-height:1.5;
}

.info{
    color:#64748b;
    font-size:12px;
    margin-top:8px;
}

.analysis-button{
    margin-top:12px;
    background:#f8fafc;
    font-weight:bold;
    border:1px solid #e2e8f0;
}

.analysis-button:active{
    transform:scale(.99);
}

.analysis{
    margin-top:10px;
    padding:12px;
    background:#f8fafc;
    border-radius:8px;
    font-size:13px;
    line-height:1.7;
}

.market{
    margin-top:8px;
    padding:9px;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:8px;
}

.market-title{
    font-weight:bold;
    margin-bottom:5px;
}

.odds{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.odd{
    background:#eef2ff;
    padding:7px 9px;
    border-radius:7px;
    font-weight:bold;
}

.prob{
    color:#475569;
    font-size:12px;
    margin-top:3px;
}

.summary{
    margin-top:10px;
    padding:10px;
    background:#ecfdf5;
    border-radius:8px;
    font-weight:bold;
}

.warning{
    margin-top:8px;
    padding:8px;
    background:#fff7ed;
    border-radius:7px;
    font-size:12px;
    color:#9a3412;
}

.empty{
    text-align:center;
    padding:25px;
    color:#64748b;
}
</style>
</head>

<body>

<header>
    <h1>⚽ İddaa Analiz Botu 26/27</h1>
    <p>Maçkolik • İddaa oranları • İstatistiksel analiz</p>
</header>

<div class="panel">

    <div class="row">
        <button onclick="changeDay(-1)">⬅ Önceki</button>
        <button onclick="changeDay(1)">Sonraki ➡</button>
    </div>

    <input
        id="search"
        type="text"
        placeholder="🔎 Takım ara..."
        oninput="render()"
    >

    <select id="league" onchange="render()">
        <option value="">Tüm Ligler</option>
    </select>

    <button onclick="loadData()">🔄 Maçları Yenile</button>

</div>

<div id="status">
    ⏳ Veriler hazırlanıyor...
</div>

<div id="matches"></div>

<script>

let selectedDate = new Date();
let allMatches = [];
let allOdds = {};


/* =========================
   TARİH
========================= */

function pad(n){
    return n < 10 ? "0" + n : String(n);
}

function dateString(date){
    return date.getFullYear() + "-" +
        pad(date.getMonth() + 1) + "-" +
        pad(date.getDate());
}

function changeDay(amount){

    selectedDate.setDate(
        selectedDate.getDate() + amount
    );

    loadData();
}


/* =========================
   DURUM
========================= */

function setStatus(text){
    document.getElementById("status").innerHTML = text;
}


/* =========================
   GÜVENLİ HTML
========================= */

function escapeHtml(text){

    if(text === null || text === undefined){
        return "";
    }

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   TAKIM ADI
========================= */

function getTeamName(team){

    if(!team){
        return "";
    }

    if(typeof team === "string"){
        return team;
    }

    return team.name ||
           team.teamName ||
           team.displayName ||
           "";
}

function getHome(match){

    return getTeamName(
        match.homeTeam || match.home
    ) || "Ev Sahibi";
}

function getAway(match){

    return getTeamName(
        match.awayTeam || match.away
    ) || "Deplasman";
}


/* =========================
   LİG
========================= */

function getLeague(match){

    return match.league ||
           match.competitionName ||
           match.leagueName ||
           "Diğer";
}


/* =========================
   SAAT
========================= */

function getTime(match){

    if(match.mstUtc){

        const d = new Date(match.mstUtc);

        if(!isNaN(d.getTime())){

            return pad(d.getHours()) +
                ":" +
                pad(d.getMinutes());
        }
    }

    return match.matchTime ||
           match.time ||
           "--:--";
}


/* =========================
   ORANLAR
========================= */

function getOdds(match){

    if(!match){
        return null;
    }

    const id =
        match.id ||
        match.matchId ||
        match.eventId;

    if(id === undefined || id === null){
        return null;
    }

    return allOdds[id] ||
           allOdds[String(id)] ||
           null;
}


/* =========================
   ORAN TEMİZLE
========================= */

function uniqueOptions(list){

    const result = [];
    const seen = {};

    if(!Array.isArray(list)){
        return result;
    }

    for(const item of list){

        if(!item){
            continue;
        }

        let secenek =
            item.secenek ||
            item.option ||
            item.name ||
            item.label;

        let oran =
            item.oran ??
            item.odds ??
            item.odd ??
            item.value;

        if(secenek === undefined || oran === undefined){
            continue;
        }

        oran = parseFloat(
            String(oran).replace(",",".")
        );

        if(!secenek || isNaN(oran)){
            continue;
        }

        const key =
            String(secenek) + "|" + oran;

        if(seen[key]){
            continue;
        }

        seen[key] = true;

        result.push({
            secenek:String(secenek),
            oran:oran
        });
    }

    return result;
}


/* =========================
   OLASILIK
========================= */

function probability(list){

    const valid = list.filter(
        item => item.oran > 1
    );

    if(!valid.length){
        return [];
    }

    let total = 0;

    for(const item of valid){
        total += 1 / item.oran;
    }

    return valid.map(item => {

        const p =
            ((1 / item.oran) / total) * 100;

        return {
            secenek:item.secenek,
            oran:item.oran,
            p:p
        };

    });
}


/* =========================
   MARKET
========================= */

function marketHtml(title,list){

    const clean = uniqueOptions(list);

    if(!clean.length){
        return "";
    }

    const probs = probability(clean);

    let html =
        "<div class='market'>";

    html +=
        "<div class='market-title'>" +
        escapeHtml(title) +
        "</div>";

    html += "<div class='odds'>";

    for(const item of probs){

        html +=
            "<div class='odd'>" +
            escapeHtml(item.secenek) +
            " — " +
            item.oran.toFixed(2) +
            "<div class='prob'>" +
            item.p.toFixed(1) +
            "% piyasa olasılığı" +
            "</div>" +
            "</div>";
    }

    html += "</div></div>";

    return html;
}


/* =========================
   MARKET ANAHTARI BUL
========================= */

function findMarket(odds, possibleNames){

    if(!odds || typeof odds !== "object"){
        return null;
    }

    for(const name of possibleNames){

        if(odds[name]){
            return odds[name];
        }
    }

    /* Büyük/küçük harf farklarını da kontrol et */

    const keys = Object.keys(odds);

    for(const key of keys){

        const lowerKey =
            key.toLowerCase().replace(/\s/g,"");

        for(const name of possibleNames){

            const lowerName =
                name.toLowerCase().replace(/\s/g,"");

            if(lowerKey === lowerName){
                return odds[key];
            }
        }
    }

    return null;
}


/* =========================
   ANALİZ
========================= */

function makeAnalysis(match){

    const odds = getOdds(match);

    let html =
        "<b>📊 Otomatik Analiz</b>";

    if(!odds){

        html +=
            "<div class='warning'>" +
            "⚠️ Bu maç için oran verisi bulunamadı." +
            "</div>";

        return html;
    }


    /* MAÇ SONUCU */

    const macSonucu =
        findMarket(
            odds,
            [
                "Maç Sonucu",
                "Mac Sonucu",
                "MS",
                "1X2",
                "Match Result"
            ]
        );

    if(macSonucu){

        html += marketHtml(
            "🏆 Maç Sonucu",
            macSonucu
        );
    }


    /* 2.5 ALT ÜST */

    const altUst =
        findMarket(
            odds,
            [
                "2,5 Alt/Üst",
                "2.5 Alt/Üst",
                "2.5 Alt Üst",
                "2,5 Alt Üst",
                "Alt/Üst",
                "Alt Ust",
                "Over/Under 2.5"
            ]
        );

    if(altUst){

        html += marketHtml(
            "⚽ 2.5 Alt / Üst",
            altUst
        );
    }


    /* KG */

    const kg =
        findMarket(
            odds,
            [
                "Karşılıklı Gol",
                "KG Var/Yok",
                "Karşılıklı Gol Var/Yok",
                "KG",
                "Both Teams To Score"
            ]
        );

    if(kg){

        html += marketHtml(
            "🥅 Karşılıklı Gol",
            kg
        );
    }


    /*
       Eğer yukarıdaki bilinen marketler
       bulunamadıysa, JSON içindeki diğer
       marketleri de göstermeye çalış.
    */

    let knownCount = 0;

    if(macSonucu) knownCount++;
    if(altUst) knownCount++;
    if(kg) knownCount++;


    if(knownCount === 0){

        const keys = Object.keys(odds);

        for(const key of keys){

            const value = odds[key];

            if(Array.isArray(value)){

                html += marketHtml(
                    key,
                    value
                );
            }
        }
    }


    if(knownCount === 0){

        html +=
            "<div class='warning'>" +
            "⚠️ Oran verisi bulundu fakat tanınan bahis marketi bulunamadı." +
            "</div>";
    }

    return html;
}


/* =========================
   ANALİZİ AÇ / KAPAT
========================= */

function toggleAnalysis(index){

    const box =
        document.getElementById(
            "analysis-" + index
        );

    const button =
        document.getElementById(
            "analysis-btn-" + index
        );

    if(!box || !button){
        return;
    }

    if(box.style.display === "none"){

        box.innerHTML =
            makeAnalysis(
                window.visibleMatches[index]
            );

        box.style.display = "block";

        button.innerHTML =
            "📊 Analizi Gizle";

    }else{

        box.style.display = "none";

        button.innerHTML =
            "📊 Otomatik Analiz";
    }
}


/* =========================
   LİG FİLTRESİ
========================= */

function prepareLeagues(){

    const select =
        document.getElementById("league");

    const current =
        select.value;

    select.innerHTML =
        '<option value="">Tüm Ligler</option>';

    const leagues = {};

    for(const match of allMatches){

        const league =
            getLeague(match);

        if(league){
            leagues[league] = true;
        }
    }

    Object.keys(leagues)
        .sort()
        .forEach(league => {

            const option =
                document.createElement("option");

            option.value = league;
            option.textContent = league;

            select.appendChild(option);
        });

    if(
        Object.keys(leagues).includes(current)
    ){
        select.value = current;
    }
}


/* =========================
   EKRANA BAS
========================= */

function render(){

    const container =
        document.getElementById("matches");

    const search =
        document.getElementById("search")
            .value
            .toLowerCase()
            .trim();

    const league =
        document.getElementById("league")
            .value;

    let matches =
        allMatches.filter(match => {

            const home =
                getHome(match).toLowerCase();

            const away =
                getAway(match).toLowerCase();

            const matchLeague =
                getLeague(match);

            const searchOK =
                !search ||
                home.includes(search) ||
                away.includes(search);

            const leagueOK =
                !league ||
                matchLeague === league;

            return searchOK && leagueOK;
        });


    window.visibleMatches = matches;


    if(!matches.length){

        container.innerHTML =
            "<div class='empty'>" +
            "Bu kriterlere uygun maç bulunamadı." +
            "</div>";

        return;
    }


    let html = "";

    for(let i = 0; i < matches.length; i++){

        const match =
            matches[i];

        const home =
            getHome(match);

        const away =
            getAway(match);

        html +=
            "<div class='match'>" +

            "<div class='league'>" +
            escapeHtml(getLeague(match)) +
            "</div>" +

            "<div class='teams'>" +
            escapeHtml(home) +
            " 🆚 " +
            escapeHtml(away) +
            "</div>" +

            "<div class='info'>" +
            "🕐 " +
            escapeHtml(getTime(match)) +
            "</div>" +

            "<button " +
            "class='analysis-button' " +
            "id='analysis-btn-" + i + "' " +
            "onclick='toggleAnalysis(" + i + ")'>" +
            "📊 Otomatik Analiz" +
            "</button>" +

            "<div " +
            "class='analysis' " +
            "id='analysis-" + i + "' " +
            "style='display:none'>" +
            "</div>" +

            "</div>";
    }

    container.innerHTML = html;
}


/* =========================
   VERİ YÜKLE
========================= */

async function loadData(){

    const tarih =
        dateString(selectedDate);

    setStatus(
        "⏳ " +
        tarih +
        " maçları yükleniyor..."
    );

    try{

        const response =
            await fetch(
                "data/oranlar-" +
                tarih +
                ".json?x=" +
                Date.now()
            );

        if(!response.ok){

            throw new Error(
                "Veri dosyası bulunamadı."
            );
        }

        const data =
            await response.json();

        allMatches =
            Array.isArray(data.matches)
                ? data.matches
                : [];

        allOdds =
            data.odds &&
            typeof data.odds === "object"
                ? data.odds
                : {};

        prepareLeagues();

        render();

        setStatus(
            "✅ " +
            tarih +
            " • " +
            allMatches.length +
            " maç yüklendi"
        );

    }
    catch(error){

        allMatches = [];
        allOdds = {};

        document.getElementById(
            "matches"
        ).innerHTML =
            "<div class='empty'>" +
            "⚠️ Bu tarih için veri bulunamadı." +
            "</div>";

        setStatus(
            "❌ Veri yüklenemedi"
        );

        console.error(error);
    }
}


/* =========================
   BAŞLAT
========================= */

window.visibleMatches = [];

loadData();

</script>

</body>
</html>
