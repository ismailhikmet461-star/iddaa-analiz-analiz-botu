
name: Mackolik Mac ve Oran Verileri

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: mackolik-veri
  cancel-in-progress: false

jobs:
  maclari-getir:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python paketlerini kur
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper beautifulsoup4

      - name: Mac ve oran verilerini cek
        run: |
          mkdir -p data
          cat > cek.py <<'PY'
          import json
          import re
          import time
          import unicodedata
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import cloudscraper
          from bs4 import BeautifulSoup

          BASE = "https://www.mackolik.com"
          TZ = ZoneInfo("Europe/Istanbul")

          def yeni_scraper():
              s = cloudscraper.create_scraper(
                  browser={
                      "browser": "chrome",
                      "platform": "linux",
                      "mobile": False
                  }
              )
              s.headers.update({
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 Chrome/140.0.0.0 "
                      "Safari/537.36"
                  ),
                  "Accept-Language": "tr-TR,tr;q=0.9,en;q=0.8",
                  "Referer": BASE + "/"
              })
              return s

          def slugify(text):
              text = str(text or "").strip().lower()
              text = text.translate(str.maketrans({
                  "ı": "i", "ş": "s", "ğ": "g",
                  "ü": "u", "ö": "o", "ç": "c"
              }))
              text = unicodedata.normalize("NFKD", text)
              text = text.encode("ascii", "ignore").decode("ascii")
              return re.sub(r"[^a-z0-9]+", "-", text).strip("-")

          def maclari_getir(tarih):
              url = BASE + (
                  "/perform/p0/ajax/components/"
                  "competition/livescores/json"
              )

              hata = None

              for deneme in range(3):
                  try:
                      r = yeni_scraper().get(
                          url,
                          params={
                              "sports[]": "Soccer",
                              "matchDate": tarih
                          },
                          timeout=35
                      )
                      r.raise_for_status()
                      data = r.json()
                      matches = (data.get("data") or {}).get("matches") or {}

                      if isinstance(matches, dict):
                          return [
                              m for m in matches.values()
                              if isinstance(m, dict)
                          ]

                      if isinstance(matches, list):
                          return [
                              m for m in matches
                              if isinstance(m, dict)
                          ]

                      return []

                  except Exception as e:
                      hata = e
                      print("Maç verisi denemesi:", deneme + 1, e)
                      time.sleep(2 * (deneme + 1))

              raise hata

          def oranlari_getir(match):
              mid = str(match.get("id") or match.get("matchId") or "")

              if not mid:
                  return mid, {}

              ad = str(
                  match.get("matchName")
                  or match.get("name")
                  or ""
              )

              takimlar = re.split(
                  r"\s+(?:vs?\.?|[-–])\s+",
                  ad,
                  flags=re.I
              )

              if len(takimlar) < 2:
                  print("Takım adları ayrıştırılamadı:", ad)
                  return mid, {}

              url = (
                  f"{BASE}/mac/"
                  f"{slugify(takimlar[0])}-vs-"
                  f"{slugify(takimlar[1])}/iddaa/{mid}"
              )

              try:
                  r = yeni_scraper().get(url, timeout=30)

                  if r.status_code != 200:
                      print("Oran sayfası HTTP:", r.status_code, mid)
                      return mid, {}

                  soup = BeautifulSoup(r.text, "html.parser")
                  ul = soup.select_one(
                      "ul.widget-iddaa-markets__markets-list"
                  )

                  if not ul:
                      print("Oran marketi bulunamadı:", mid)
                      return mid, {}

                  sonuc = {}
                  basliklar = ul.find_all(["h2", "h3", "h4"])
                  icerikler = ul.select(
                      "div.widget-iddaa-markets__market-content"
                  )

                  for i, icerik in enumerate(icerikler):
                      if i >= len(basliklar):
                          break

                      baslik = basliklar[i].get_text(" ", strip=True)
                      secenekler = []

                      for li in icerik.find_all("li"):
                          spans = [
                              s.get_text(" ", strip=True)
                              for s in li.find_all("span")
                          ]

                          for j in range(0, len(spans) - 1, 2):
                              secenek = spans[j].strip()
                              oran = spans[j + 1].strip()

                              if (
                                  secenek
                                  and re.fullmatch(
                                      r"\d+(?:[.,]\d+)?", oran
                                  )
                              ):
                                  secenekler.append({
                                      "secenek": secenek,
                                      "oran": oran
                                  })

                      if baslik and secenekler:
                          sonuc[baslik] = secenekler

                  return mid, sonuc

              except Exception as e:
                  print("Oran hatası:", mid, e)
                  return mid, {}

          def tarihi_isle(tarih):
              print("\nTarih:", tarih)

              try:
                  maclar = maclari_getir(tarih)
              except Exception as e:
                  print("Maçlar alınamadı:", tarih, e)
                  # Başarısız istekte eski dosyanın üstüne yazma.
                  return False

              print("Bulunan maç:", len(maclar))
              oranlar = {}

              with ThreadPoolExecutor(max_workers=5) as havuz:
                  isler = [
                      havuz.submit(oranlari_getir, mac)
                      for mac in maclar
                  ]

                  for islem in as_completed(isler):
                      try:
                          mid, veri = islem.result()
                          if mid and veri:
                              oranlar[str(mid)] = veri
                      except Exception as e:
                          print("Oran görevi hatası:", e)

              cikti = {
                  "date": tarih,
                  "source": "Mackolik",
                  "updatedAt": datetime.now(TZ).isoformat(),
                  "matches": maclar,
                  "odds": oranlar
              }

              dosya = f"data/oranlar-{tarih}.json"

              with open(dosya, "w", encoding="utf-8") as f:
                  json.dump(
                      cikti,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print(
                  "Kaydedildi:", dosya,
                  "| Maç:", len(maclar),
                  "| Oranı bulunan:", len(oranlar)
              )
              return True

          if __name__ == "__main__":
              bugun = datetime.now(TZ).date()
              tamamlanan = 0

              for gun in range(8):
                  tarih = (
                      bugun + timedelta(days=gun)
                  ).isoformat()

                  if tarihi_isle(tarih):
                      tamamlanan += 1

              print("Tamamlanan tarihler:", tamamlanan, "/ 8")

              if tamamlanan == 0:
                  raise SystemExit(
                      "Veri alınamadı. Önceki JSON dosyaları korundu."
                  )
          PY

          python cek.py

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "iddaa-analiz-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || \
            git commit -m "Mackolik mac ve oran verilerini guncelle"
          git push

              
